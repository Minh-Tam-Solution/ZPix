<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZPix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .logo { font-size: 48px; font-weight: 700; margin-bottom: 16px; }
    .status { font-size: 16px; color: #aaa; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #webview-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: none; background: #fff;
    }
    #webview-container iframe {
      width: 100%; height: 100%; border: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">⚡ ZPix</div>
    <div class="status" id="status">Starting AI engine...</div>
    <div class="spinner"></div>
  </div>
  <div id="webview-container">
    <iframe id="webview" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  </div>

  <script>
    const { listen } = window.__TAURI__.event;

    async function main() {
      const statusEl = document.getElementById('status');

      listen('gradioprogress', (event) => {
        statusEl.textContent = event.payload;
      });

      listen('gradioready', (event) => {
        const url = event.payload;
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('webview-container');
        container.style.display = 'block';
        document.getElementById('webview').src = url;
      });
    }

    main().catch(console.error);
  </script>
</body>
</html>
